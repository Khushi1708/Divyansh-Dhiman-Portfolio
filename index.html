<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#f4f6fb;--card:rgba(255,255,255,.75);--ink:#0e1424;--muted:#55627d;--line:#d3dae8;--accent:#0a8c64;--ai:#fff;--rgb:10,140,100;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#080d1a;--card:rgba(15,23,42,.7);--ink:#e6ebf5;--muted:#8a95ad;--line:#1f2a44;--accent:#34d9a3;--ai:#06231a;--rgb:52,217,163;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.7 Inter,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:"Instrument Serif",Georgia,serif;font-weight:400;line-height:1;margin:0;letter-spacing:-.01em}
a{color:inherit}.mono{font:500 .72rem/1.4 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
.gridbg{position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;opacity:.5;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000,transparent 72%);mask-image:radial-gradient(ellipse at 50% 20%,#000,transparent 72%)}
.aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:44vmax;height:44vmax;border-radius:50%;filter:blur(110px);opacity:.22;background:var(--accent);animation:drift 24s ease-in-out infinite alternate}
.aurora i:nth-child(1){top:-16vmax;left:-12vmax}.aurora i:nth-child(2){bottom:-22vmax;right:-12vmax;background:#5b6dff;opacity:.2;animation-duration:31s}
@keyframes drift{to{transform:translate(12vmax,9vmax) scale(1.25)}}

.curtain.in{opacity:1;transition:opacity .22s ease-out}.curtain.in::after{transform:scaleX(1);transition:transform .3s ease-out}
.curtain.out{opacity:0;transition:opacity .3s ease-in .05s}.curtain.out::after{transform:scaleX(1) translateX(100%);transition:transform .3s ease-in}



.logo{position:fixed;left:1.5rem;top:calc(env(safe-area-inset-top,0px) + 20px);z-index:20;font:500 1.4rem "JetBrains Mono",monospace;text-decoration:none}.logo b{color:var(--accent)}

.pn a{padding:.5rem .9rem;border-radius:999px;text-decoration:none;color:var(--muted);white-space:nowrap}.pn a:hover{color:var(--ink)}
.pn a[aria-current="page"]{background:rgba(var(--rgb),.16);color:var(--accent)}
main{max-width:1120px;margin:auto;padding:8rem 1.5rem 3rem}
.sec{margin-top:7rem}

.ch>b{display:inline-block;font-weight:inherit;transform:translateY(112%) rotate(5deg);animation:up .95s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*55ms + 200ms)}
@keyframes up{to{transform:none}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start}
.two h3{font-size:clamp(2.4rem,5vw,4rem)}.two h3 em{color:var(--muted)}

.mq{overflow:hidden;border-block:1px solid var(--line);padding:1.1rem 0;margin-top:4rem;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq>div{display:flex;width:max-content;animation:mq 32s linear infinite}.mq:hover>div{animation-play-state:paused}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.5rem}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transform-style:preserve-3d;will-change:transform}

.cb{padding:1.6rem;display:grid;gap:.8rem}.cb h3{font:500 1.45rem "JetBrains Mono",monospace;letter-spacing:-.02em}.cb h3 b{color:var(--accent)}.cb p{margin:0;color:var(--muted);font-size:.95rem}

.step{display:flex;gap:.9rem;opacity:0;transform:translateX(-14px);animation:in .5s forwards;animation-delay:calc(var(--i)*.35s)}

.step b{display:block;font-weight:500}.step span{color:var(--muted);font-size:.92rem}
@keyframes in{to{opacity:1;transform:none}}@keyframes ping{0%{box-shadow:0 0 0 0 rgba(var(--rgb),.55)}70%,100%{box-shadow:0 0 0 10px rgba(var(--rgb),0)}}

.prose{max-width:42rem}.prose p{color:var(--muted);margin:0 0 1.2rem;font-size:1.08rem}
.nl{text-align:center;max-width:36rem;margin:2rem auto;display:grid;gap:1.2rem;justify-items:center}
.nl h2{font-size:clamp(2.8rem,8vw,5rem)}.nl h2 span{color:var(--muted);display:block}

.nl .row{display:flex;gap:.6rem;width:100%;border:1px solid var(--line);border-radius:8px;padding:.5rem;background:var(--card)}

.cta{padding:4rem 1.5rem;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--card)}.cta h2{font-size:clamp(2.4rem,6vw,4rem);margin-bottom:1.5rem}
.top{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;color:var(--muted);margin-bottom:1rem}
.wt{font-size:clamp(3rem,10vw,7.5rem);line-height:.92}.wt span{display:block;color:var(--muted)}
.sr{display:flex;align-items:center;max-width:620px;margin-top:3.5rem;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.sr input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:400 .85rem "JetBrains Mono",monospace;padding:1.1rem 1.2rem}.sr input:focus{outline:none}.sr:focus-within{border-color:var(--accent)}
.chips{display:flex;gap:.6rem;flex-wrap:wrap;margin:1.4rem 0 2rem}
.chip{font:400 .8rem "JetBrains Mono",monospace;cursor:pointer;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:.55rem .9rem}
.chip[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:rgba(var(--rgb),.1)}
.cnt{color:var(--muted);padding-bottom:1rem;border-bottom:1px solid var(--line);margin:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-top:3rem}.topbar .chips{margin:0}.cnt2{color:var(--muted)}
.vr{display:grid;grid-template-columns:1.1fr 1fr;gap:3rem;align-items:start;padding:4rem 0;border-top:1px solid var(--line);margin-top:3rem}
.vl{display:grid;gap:1rem}.vl .mono{color:var(--muted)}.vl p{margin:0;color:var(--muted)}.vl p.vline{color:var(--ink);font-size:1.15rem}
.vt{font:500 clamp(2.2rem,5vw,4rem) "JetBrains Mono",monospace;letter-spacing:-.04em;line-height:1;margin:0;overflow-wrap:anywhere}.vt b{color:var(--accent);font-weight:500}
.vact{display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap}
.vr.open .flow{display:grid}
.code2{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;position:sticky;top:6rem}
.cbar{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border-bottom:1px solid var(--line);color:var(--muted)}.cbar .mono{flex:1;text-transform:none;letter-spacing:.03em}
.dots{display:flex;gap:.35rem}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.cp{cursor:pointer;background:transparent;border:0;color:var(--muted);text-transform:none}.cp:hover{color:var(--accent)}
.cbody{padding:1.2rem 0;overflow-x:auto;font:400 .82rem/1.9 "JetBrains Mono",monospace}
.ln{display:flex;gap:1.2rem;padding:0 1.2rem;white-space:pre}.ln i{color:var(--muted);font-style:normal;width:1.2rem;text-align:right;flex:none;opacity:.6}
.conv{display:flex;align-items:center;gap:1.2rem;border-top:1px solid var(--line);padding:2.5rem 0 1rem;flex-wrap:wrap}.conv svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:2}.conv h3{font:500 1.35rem Inter,sans-serif}.conv p{margin:.2rem 0 0;color:var(--muted);font-size:.95rem}.conv>div{flex:1;min-width:240px}
.note{color:var(--muted);text-transform:none;letter-spacing:.03em;margin:1.5rem 0 0}
@media (max-width:860px){.vr{grid-template-columns:1fr;gap:2rem}.code2{position:static}}
.ab{display:grid;grid-template-columns:.9fr 1.1fr;gap:3.5rem;align-items:start;margin-top:4rem;border-top:1px solid var(--line);padding-top:3.5rem}
.fig{margin:0}.fig svg{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;display:block}.fig figcaption{display:flex;justify-content:space-between;gap:1rem;margin-top:.8rem;color:var(--muted);text-transform:none;letter-spacing:.03em}
.abt{display:grid;gap:1.1rem}.abt .mono{color:var(--muted)}.abt h2{font-size:clamp(2.6rem,6vw,4.6rem)}.abt p{margin:0;color:var(--muted)}.abt p.big{color:var(--ink);font-size:1.35rem;line-height:1.5}
.hw{font-size:clamp(2.6rem,6vw,4.6rem);margin:.8rem 0 2rem}
.prin>div{display:grid;grid-template-columns:3rem 3rem 1.1fr 1fr;gap:1.2rem;align-items:center;padding:2rem 0;border-top:1px solid var(--line)}.prin h3{font-size:clamp(1.8rem,3.5vw,2.6rem)}.prin svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.8}.prin p{margin:0;color:var(--muted)}.prin .mono{color:var(--muted)}
@media (max-width:860px){.ab{grid-template-columns:1fr;gap:2rem}.prin>div{grid-template-columns:2rem 2rem 1fr}.prin p{grid-column:1/-1}}
footer{max-width:1120px;margin:auto;padding:2rem 1.5rem 3rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;color:var(--muted)}
footer div{display:flex;gap:1.2rem;flex-wrap:wrap}
.rv{opacity:0;transform:translateY(34px);filter:blur(6px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1),filter .8s;transition-delay:calc(var(--d,0)*90ms)}
.rv.on{opacity:1;transform:none;filter:none}.card.rv.on{transition:transform .25s ease-out,opacity .3s;transition-delay:0s}
@media (max-width:860px){.two{grid-template-columns:1fr;gap:1.5rem}.logo,.tog{display:none}.post{grid-template-columns:1fr}.post .r{text-align:left}main{padding-top:6.5rem}}


.stage{margin:3rem 0 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;background:#050912}
.stage svg{display:block;width:100%;height:auto;max-height:520px}
.stage figcaption{position:absolute;left:1.5rem;bottom:1.2rem;color:#c9d3e6;text-transform:none;letter-spacing:.04em;display:flex;gap:.6rem;align-items:center}
.stage figcaption b{color:var(--accent);font-weight:500}
.tkh{margin-top:6rem}.tkh .mono{color:var(--muted)}.tkh h2{font-size:clamp(2.4rem,6vw,4.4rem);margin-top:.6rem;padding-bottom:1.5rem;border-bottom:1px solid var(--line)}.tkh h2 i{font-style:normal;color:var(--accent)}
.tk{border-bottom:1px solid var(--line)}
.tkb{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:3rem 1fr auto;gap:1.2rem;align-items:center;width:100%;padding:2rem 0}
.tkb:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.tkb .n{color:var(--muted);align-self:start;padding-top:.6rem}
.tkb .k{color:var(--muted);display:block;margin-bottom:.4rem}
.tkb h3{font-size:clamp(1.8rem,4vw,2.8rem)}
.tkb p{margin:.6rem 0 0;color:var(--muted);max-width:44rem;font-size:.98rem}

.tkb .m svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .3s}
.tk.open .tkb .m svg{transform:rotate(180deg);color:var(--accent)}

.tk.open .tkd{display:grid}
.tkd>div:first-child{grid-column:1}
.tkd .c{grid-column:auto;border-left:1px solid var(--line);padding-left:1rem}

.tkd .c p,.tkd .c li{margin:0;color:var(--muted);font-size:.92rem}.tkd ul{margin:0;padding-left:1rem}
.fnote{color:var(--muted);text-transform:none;letter-spacing:.03em;font-size:.82rem;margin:1.6rem 0 0;opacity:.95}

.eq h2{font-size:clamp(2.6rem,6vw,4.6rem)}.eq h2 span{color:var(--accent)}
.eq .lede{margin:1.5rem 0 1.5rem;text-align:left;max-width:28rem}
.live{display:flex;align-items:center;gap:.6rem;color:var(--muted);text-transform:none;letter-spacing:.04em}.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.sform{display:grid;gap:1.1rem}

.sform input,.sform textarea{width:100%;font:400 .9rem "JetBrains Mono",monospace;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.9rem 1rem}
.sform textarea{min-height:150px;resize:vertical}

@media (max-width:860px){.eq{grid-template-columns:1fr;gap:2rem}.sform .r2{grid-template-columns:1fr}.tkb{grid-template-columns:2rem 1fr}.tkb .m{grid-column:2}.tkd{grid-template-columns:1fr}.tkd>div:first-child{display:none}.tkd .c{margin-left:0}}

</style>
</head>

}

 let h=(location.hash||"#intro").slice(1);if(h==="newsletter")h="connect";if(!pages.includes(h))h="intro";
 main.innerHTML=views[h]();wfill();vfill();
 nav.innerHTML=pages.map(p=>`<a href="#${p}"${p===h?' aria-current="page"':""}>${lab[p]}</a>`).join("");
 document.title=(h==="intro"?"":lab[h]+" – ")+"Divyansh Dhiman";scrollTo(0,0);fx();
}
main.addEventListener("click",e=>{
 const cp=e.target.closest(".cp");if(cp){const t0=decodeURIComponent(cp.dataset.c);navigator.clipboard&&navigator.clipboard.writeText(t0).then(()=>{cp.textContent="Copied";setTimeout(()=>cp.textContent="Copy",1500)}).catch(()=>{});return}
 const tb=e.target.closest(".tkb");if(tb){const a=tb.closest(".tk"),o=a.classList.toggle("open");tb.setAttribute("aria-expanded",o);return}
 const vc=e.target.closest(".vc");if(vc){vf=vc.dataset.v;vfill();return}
 const t=e.target.closest(".chip");if(t){topic=t.dataset.t;wfill();return}const h=e.target.closest(".how");if(h){const c=h.closest(".card,.vr"),o=c.classList.toggle("open");h.setAttribute("aria-expanded",o);h.textContent=o?"Hide steps":"How it works";return}
});
main.addEventListener("submit",e=>{if(e.target.id!=="sform")return;e.preventDefault();
 const n=$("#sn").value.trim(),m=$("#se").value.trim(),er=$("#serr");
 if(!n||!/^\S+@\S+\.\S+$/.test(m)){er.textContent="Please add your name and a valid email address.";return}
 er.textContent="";
 const b=`Name: ${n}\nEmail: ${m}\nEvent/organization: ${$("#so").value.trim()}\n\n${$("#sm").value.trim()}`;
 location.href=`mailto:${D.email}?subject=${encodeURIComponent("Speaking enquiry"+($("#so").value.trim()?" – "+$("#so").value.trim():""))}&body=${encodeURIComponent(b)}`});
main.addEventListener("input",e=>{if(e.target.id==="q"){qs=e.target.value.toLowerCase();wfill()}});
$("#tog").addEventListener("click",()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--ai").trim()==="#06231a";r.setAttribute("data-theme",d?"light":"dark")});
/* animated network background */
const cv=$("#bg"),g=cv.getContext("2d");let W,H,P=[],mx=-999,my=-999,rgb="52,217,163",fr=0;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(110,Math.floor(W*H/14000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}))}
function draw(){
 if(fr++%40===0)rgb=getComputedStyle(document.documentElement).getPropertyValue("--rgb").trim()||rgb;
 g.clearRect(0,0,W,H);
 for(const p of P){if(!RM){p.x+=p.vx;p.y+=p.vy;const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<150){p.x+=dx/d*1.6;p.y+=dy/d*1.6}if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0}
  g.fillStyle=`rgba(${rgb},.7)`;g.beginPath();g.arc(p.x,p.y,1.7,0,6.283);g.fill()}
 for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);if(d<130){g.strokeStyle=`rgba(${rgb},${(1-d/130)*.35})`;g.beginPath();g.moveTo(P[i].x,P[i].y);g.lineTo(P[j].x,P[j].y);g.stroke()}}
 for(const p of P){const d=Math.hypot(p.x-mx,p.y-my);if(d<170){g.strokeStyle=`rgba(${rgb},${(1-d/170)*.7})`;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(mx,my);g.stroke()}}
 if(!RM)requestAnimationFrame(draw);
}
size();draw();addEventListener("resize",()=>{size();RM&&draw()});

if(!RM&&matchMedia("(pointer:fine)").matches){
 addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY;sp.style.setProperty("--mx",mx+"px");sp.style.setProperty("--my",my+"px")});
 
}
addEventListener("hashchange",()=>{if(RM){route();return}cu.className="curtain in";setTimeout(()=>{route();cu.className="curtain out";setTimeout(()=>cu.className="curtain",380)},260)});
route();
</script>
